<!doctype html>
<!--
  Framed screenshot for the README: frame.html#<shot>  (shot = file name in shots/, without .jpg)
  Rendered at 1800x1180 by tools/render-docs.mjs.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graphite frame</title>
<style>
	:root { --bg: #0b0b0d; --border: #2c2c33; --accent: #8fa8ff; }
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); }
	body { position: relative; }
	.glow {
		position: absolute; inset: 0;
		background:
			radial-gradient(1100px 520px at 50% 0%, rgba(143, 168, 255, .16), transparent 70%),
			radial-gradient(900px 400px at 50% 110%, rgba(143, 168, 255, .07), transparent 70%);
	}
	.grid {
		position: absolute; inset: 0;
		background-image: radial-gradient(rgba(255, 255, 255, .05) 1px, transparent 1.2px);
		background-size: 26px 26px;
		-webkit-mask-image: radial-gradient(1000px 640px at 50% 40%, transparent 55%, rgba(0,0,0,.9) 100%);
	}
	.win {
		position: absolute; left: 50%; top: 80px; width: 1600px; transform: translateX(-50%);
		border-radius: 16px; overflow: hidden; border: 1px solid var(--border); background: #111114;
		box-shadow: 0 60px 140px rgba(0,0,0,.65), 0 16px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.02), inset 0 1px 0 rgba(255,255,255,.05);
	}
	.win img { display: block; width: 100%; height: auto; }
	/* narrower windows (settings) */
	body.small .win { width: 1100px; top: 70px; }
	/* soft fade at the bottom so the window sinks into the page */
	.fade { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; background: linear-gradient(transparent, var(--bg) 85%); z-index: 3; }
</style>
</head>
<body>
	<div class="glow"></div>
	<div class="grid"></div>
	<div class="win"><img id="shot" alt=""></div>
	<div class="fade"></div>
	<script>
		const name = decodeURIComponent(location.hash.slice(1)) || 'library';
		if (name === 'settings') document.body.classList.add('small');
		document.getElementById('shot').src = 'shots/' + name + '.jpg';
	</script>
</body>
</html>
