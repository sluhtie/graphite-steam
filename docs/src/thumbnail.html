<!doctype html>
<!--
  Source for docs/thumbnail.jpg (the theme's header_image on steambrew.app).
  Regenerate from the repo root with Chrome:
    chrome --headless --hide-scrollbars --window-size=1920,1080 \
      --screenshot=docs/thumbnail.jpg docs/thumbnail.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graphite thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
	:root {
		--bg: #0b0b0d;
		--surface: #111114;
		--surface-2: #18181c;
		--border: #26262c;
		--text: #ececf0;
		--text-2: #a1a1ab;
		--text-3: #6b6b75;
		--accent: #8fa8ff;
	}
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 1920px; height: 1080px; overflow: hidden; }
	body {
		background: var(--bg);
		font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", sans-serif;
		color: var(--text);
		-webkit-font-smoothing: antialiased;
		position: relative;
	}

	/* soft accent light behind the windows + faint dot grid */
	.glow {
		position: absolute; inset: 0;
		background:
			radial-gradient(900px 620px at 1380px 520px, rgba(143, 168, 255, 0.13), transparent 70%),
			radial-gradient(700px 500px at 260px 980px, rgba(143, 168, 255, 0.05), transparent 70%);
	}
	.grid {
		position: absolute; inset: 0;
		background-image: radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1.2px);
		background-size: 28px 28px;
		mask-image: linear-gradient(90deg, rgba(0,0,0,0.9), rgba(0,0,0,0.25) 55%, transparent 80%);
	}

	/* --- left: wordmark ---------------------------------------------------- */
	.copy {
		position: absolute; left: 128px; top: 0; bottom: 0; width: 760px;
		display: flex; flex-direction: column; justify-content: center;
		z-index: 3;
	}
	.mark {
		width: 84px; height: 84px; margin-bottom: 40px;
	}
	h1 {
		font-size: 150px; font-weight: 650; letter-spacing: -0.045em; line-height: 0.95;
	}
	.tagline {
		margin-top: 30px;
		font-size: 38px; font-weight: 450; line-height: 1.3; color: var(--text-2);
		letter-spacing: -0.01em;
	}
	.chips { display: flex; flex-wrap: nowrap; gap: 10px; margin-top: 48px; }
	.chip {
		font-size: 20px; font-weight: 500; color: var(--text); white-space: nowrap;
		padding: 9px 17px; border-radius: 999px;
		background: var(--surface-2); border: 1px solid var(--border);
	}
	.chip b { color: var(--accent); font-weight: 600; }
	.foot {
		margin-top: 56px; font-size: 19px; font-weight: 600; letter-spacing: 0.16em;
		text-transform: uppercase; color: var(--text-3);
	}

	/* --- right: screenshots ------------------------------------------------ */
	.stage {
		position: absolute; left: 880px; top: 0; width: 1400px; height: 1080px;
		perspective: 2400px; z-index: 2;
	}
	.win {
		position: absolute;
		border-radius: 18px; overflow: hidden;
		border: 1px solid #2c2c33;
		background: var(--surface);
		box-shadow:
			0 50px 120px rgba(0, 0, 0, 0.65),
			0 12px 32px rgba(0, 0, 0, 0.45),
			inset 0 1px 0 rgba(255, 255, 255, 0.04);
		transform-origin: left center;
	}
	.win img { display: block; width: 100%; height: auto; }
	.win.back {
		left: 110px; top: 150px; width: 1180px;
		transform: rotateY(-16deg) rotateX(3deg);
	}
	.win.front {
		left: 40px; top: 560px; width: 760px;
		transform: rotateY(-16deg) rotateX(3deg) translateZ(80px);
	}
	/* fade the stage into the background at the right / bottom edges */
	.fade {
		position: absolute; inset: 0; z-index: 4; pointer-events: none;
		background:
			linear-gradient(90deg, transparent 82%, var(--bg) 100%),
			linear-gradient(180deg, transparent 84%, rgba(11, 11, 13, 0.9) 100%);
	}
</style>
</head>
<body>
	<div class="glow"></div>
	<div class="grid"></div>

	<div class="copy">
		<!-- graphite has a hexagonal crystal lattice -->
		<svg class="mark" viewBox="0 0 84 84" fill="none">
			<path d="M42 6 73.2 24v36L42 78 10.8 60V24L42 6Z" stroke="#8fa8ff" stroke-width="4" stroke-linejoin="round"/>
			<path d="M42 26 56 34v16l-14 8-14-8V34l14-8Z" fill="#8fa8ff" fill-opacity="0.9"/>
		</svg>
		<h1>Graphite</h1>
		<p class="tagline">A clean, minimal and modern<br>theme for Steam.</p>
		<div class="chips">
			<span class="chip">Library</span>
			<span class="chip">Store</span>
			<span class="chip">Community</span>
			<span class="chip">Market</span>
			<span class="chip"><b>Custom</b> accent</span>
		</div>
		<p class="foot">Theme for Millennium</p>
	</div>

	<div class="stage">
		<div class="win back"><img src="library.jpg" alt=""></div>
		<div class="win front"><img src="game.jpg" alt=""></div>
	</div>

	<div class="fade"></div>
</body>
</html>
